[package]
name = "security_core"
version = "0.2.9"
edition = "2021"
description = "Viv Canonical Alpha — Rust security layer (bidirectional IN/OUT gate, immutable laws)"
authors = ["Travis Miner"]

[lib]
name = "security_core"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "security_core_cli"
path = "src/bin/cli.rs"

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10.9"
hex = "0.4.3"
windows-sys = { version = "0.52.0", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_Memory",
] }
